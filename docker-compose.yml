version: "3.9"

services:
  backend:
    build:
      context: ./backend

    container_name: maskvision-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend/app/uploads:/app/app/uploads
      - ./backend/app/processed:/app/app/processed

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: maskvision-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/functions

    depends_on:
      - backend

    restart: unless-stopped